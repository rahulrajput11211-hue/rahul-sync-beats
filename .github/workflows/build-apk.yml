name: Build SyncBeat APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the Flutter app folder
        id: find
        run: |
          PUBSPEC=$(find . -name pubspec.yaml -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml not found"; exit 1; fi
          APP_DIR=$(dirname "$PUBSPEC")
          echo "dir=$APP_DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter app folder: $APP_DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing Android project files
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name syncbeat --org com.syncbeat .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/main.dart lib/main.dart

            - name: Raise Android compileSdk for newer plugins
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then
              sed -i -E 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]*=?[[:space:]]*[^[:space:]].*$/\1compileSdk = 36/' "$f"
              grep -n "compileSdk" "$f"
            fi
          done
          - name: Point the app at the Render server by default
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          sed -i "s#ws://192.168.1.25:8787#wss://rahul-sync-beats.onrender.com#g" lib/main.dart
          grep -n "onrender" lib/main.dart || true

      - name: Install packages
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncBeat-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
